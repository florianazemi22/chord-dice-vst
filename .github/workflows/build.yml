name: Build Chord Dice

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the WebView2 SDK (used for the plugin window)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile nuget.exe
          ./nuget.exe install Microsoft.Web.WebView2 -OutputDirectory "${{ github.workspace }}/webview2"

      - name: Configure
        run: cmake -S . -B build -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/webview2"

      - name: Build
        run: cmake --build build --config Release --target ChordDice_VST3 ChordDice_Standalone --parallel

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/ChordDice_artefacts/Release/VST3/Chord Dice.vst3" out/
          Copy-Item "build/ChordDice_artefacts/Release/Standalone/Chord Dice.exe" out/
          Copy-Item README.md out/
          Compress-Archive -Path out/* -DestinationPath ChordDice-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ChordDice-Windows
          path: ChordDice-Windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --target ChordDice_VST3 --parallel

      - name: Zip
        run: ditto -c -k --keepParent "build/ChordDice_artefacts/Release/VST3/Chord Dice.vst3" ChordDice-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ChordDice-macOS
          path: ChordDice-macOS.zip

  # Every build on main replaces the "latest" release, so the download links never change:
  # https://github.com/<owner>/chord-dice-vst/releases/latest/download/ChordDice-Windows.zip
  release:
    if: github.ref == 'refs/heads/main'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create latest dist/ChordDice-Windows.zip dist/ChordDice-macOS.zip \
            --repo "$REPO" --target "${{ github.sha }}" --title "Chord Dice (latest build)" \
            --notes "Built from ${{ github.sha }}. Windows: unzip and copy the Chord Dice.vst3 folder to C:\\Program Files\\Common Files\\VST3\\. See README for FL Studio setup."
